name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Every job reads its runner from the repository variable CI_RUNS_ON (a JSON
# runner label or label list); unset, they run on ubuntu-22.04. Fork pull
# requests always use hosted runners.
jobs:
  tests:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-22.04"') || 'ubuntu-22.04' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install dependencies
        run: |
          uv pip install -e . pytest h5py
      - name: Run tests
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pytest -q -m "not large and not reference"

  coverage:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-22.04"') || 'ubuntu-22.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install dependencies
        run: |
          uv pip install -e . pytest pytest-cov h5py
      - name: Fetch checksummed reference data
        run: python tools/fetch_reference_data.py
      - name: Run coverage suite
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
          XLA_FLAGS: --xla_force_host_platform_device_count=2
          TMPDIR: ${{ runner.temp }}
        run: |
          python -m pytest -q -m "not large" \
            --cov=virtual_casing_jax \
            --cov-fail-under=95 \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Upload coverage XML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Check Codecov token
        id: codecov-token
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured."
          fi
      - name: Upload coverage to Codecov
        if: steps.codecov-token.outputs.available == 'true'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNS_ON || '"ubuntu-22.04"') || 'ubuntu-22.04' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install docs dependencies
        run: |
          uv pip install -e . -r docs/requirements.txt
      - name: Build docs
        run: |
          sphinx-build -W --keep-going -b html docs docs/_build/html
