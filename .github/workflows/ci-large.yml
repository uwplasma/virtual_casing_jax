name: CI-Large

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install dependencies
        run: |
          uv pip install -e . pytest h5py
      - name: Fetch checksummed reference data
        run: python tools/fetch_reference_data.py
      - name: Run upstream-reference tests
        env:
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest -q -m "large or reference"
