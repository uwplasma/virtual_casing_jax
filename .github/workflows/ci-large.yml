name: CI-Large

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: false
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
      - name: Install dependencies
        run: |
          uv pip install -e . pytest h5py
      - name: Fetch checksummed reference data
        run: python tools/fetch_reference_data.py
      - name: Run upstream-reference tests
        env:
          JAX_ENABLE_X64: "1"
        run: |
          python -m pytest -q -m "large or reference"
