name: External Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: External benchmark entry point
        required: true
        default: simsopt-vc
        type: choice
        options:
          - simsopt-vc
          - extender
          - bmw

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  external-benchmark:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install base package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run selected external benchmark
        run: |
          case "${{ inputs.benchmark }}" in
            simsopt-vc)
              benchmarks/external/run_simsopt_vc_compare.sh
              ;;
            extender)
              benchmarks/external/run_extender_compare.sh
              ;;
            bmw)
              benchmarks/external/run_bmw_compare.sh
              ;;
          esac
