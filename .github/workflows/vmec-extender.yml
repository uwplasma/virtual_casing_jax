name: VMEX Integration

on:
  workflow_dispatch:
    inputs:
      vmex_ref:
        description: VMEX git ref to test against
        required: false
        default: main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  vmex-smoke:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout virtual_casing_jax
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: virtual_casing_jax
      - name: Checkout VMEX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: uwplasma/vmex
          ref: ${{ inputs.vmex_ref }}
          path: vmex
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e virtual_casing_jax
          python -m pip install -e vmex
          python -m pip install pytest
      - name: Run focused exterior-field and VMEX tests
        env:
          JAX_ENABLE_X64: "1"
          JAX_PLATFORMS: cpu
        run: |
          cd virtual_casing_jax
          python -m pytest -q \
            tests/test_exterior_field_branch_sign.py \
            tests/test_exterior_field_cylindrical.py \
            tests/test_exterior_field_gradients.py \
            tests/test_exterior_field_grid_export.py \
            tests/test_exterior_objectives.py
          cd ../vmex
          python -m pytest -q -m "not full" tests/test_freeboundary_diff.py
